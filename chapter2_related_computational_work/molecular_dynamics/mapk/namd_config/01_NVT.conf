#############################################################
## MAPK / WSL LOCAL GPU NAMD 3.x                          ##
#############################################################
structure          inputs/mapk_ion.psf
coordinates        inputs/mapk_ion.pdb

paraTypeCharmm     on
parameters         inputs/par_water_ions_ale.prm
parameters         inputs/par_all36_prot.prm
parameters         inputs/par_all36_cgenff.prm

exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        13.5

# Integrator
timestep            2.0
rigidBonds          all
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       20

# PME
PME                 yes
PMEGridSizeX        256
PMEGridSizeY        256
PMEGridSizeZ        256
margin              5

wrapAll             on

# NAMD 3 local CUDA/GPU-resident execution (same local strategy as ADK)
GPUresident         on

# Output cadence (preserved from supplied setup)
restartfreq         5000
dcdfreq             5000
xstFreq             5000
outputEnergies      500
outputPressure      500
outputTiming        5000

outputName          runs/01_NVT/MAPK_NVT
set temp            298
firsttimestep       0

# Initial periodic cell (only initial stage; continuation stages read .xsc)
cellBasisVector1    122.91 0 0
cellBasisVector2    0 117.13 0
cellBasisVector3    0 0 131.32
cellOrigin          7.90 0.62 -3.46

# Initial velocities
temperature         $temp

# NVT temperature control
langevin            on
langevinDamping     1
langevinTemp        $temp

# No pressure coupling in NVT
langevinPiston      off

# Preserve supplied protocol
minimize            50000
reinitvels          $temp
run                 2500000  ;# 5 ns at 2 fs
