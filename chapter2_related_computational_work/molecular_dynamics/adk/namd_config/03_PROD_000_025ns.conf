structure          inputs/ADK_ion.psf
coordinates        inputs/ADK_ion.pdb

paraTypeCharmm     on
parameters         inputs/par_water_ions_ale.prm
parameters         inputs/par_all36_prot.prm
parameters         inputs/par_all36_cgenff.prm

exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        13.5

timestep            2.0
rigidBonds          all
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       20

PME                 yes
PMEGridSizeX        128
PMEGridSizeY        128
PMEGridSizeZ        128
margin              5

wrapAll             on

restartfreq         1000
dcdfreq             1000
xstFreq             1000
outputEnergies      500
outputPressure      500
outputTiming        1000

proc get_first_ts {xscfile} {
    set fd [open $xscfile r]
    set ts ""
    while {[gets $fd line] >= 0} {
        set s [string trim $line]
        if {$s eq ""} { continue }
        if {[string index $s 0] eq "#"} { continue }
        set ts [lindex $s 0]
        break
    }
    close $fd
    if {$ts eq ""} { error "Could not read timestep from $xscfile" }
    return $ts
}

outputName          runs/03_PROD_000_025ns/ADK_PROD_000_025ns
set temp            310
set inputname       runs/02_NPT/ADK_NPT
binCoordinates      $inputname.coor
binVelocities       $inputname.vel
extendedSystem      $inputname.xsc
firsttimestep       [get_first_ts "$inputname.xsc"]

langevin            on
langevinDamping     1
langevinTemp        $temp

useGroupPressure      yes
useFlexibleCell       no
useConstantArea       no
langevinPiston        on
langevinPistonTarget  1.01325
langevinPistonPeriod  200.0
langevinPistonDecay   50.0
langevinPistonTemp    $temp

run                 12500000
